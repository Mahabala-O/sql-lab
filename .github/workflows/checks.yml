name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reference solutions, wrong and alternative answers, requirement coverage, engine
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Both pages in a headless browser
      - run: npm run e2e
